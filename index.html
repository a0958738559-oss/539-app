
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5bd00">
<title>539AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5bd00;color:#164b40;font-family:system-ui,'Noto Sans TC',sans-serif}main{max-width:650px;margin:0 auto;min-height:100vh;padding:16px;background:#fffbea;border:12px solid #f5bd00}.heading{background:#087e6b;color:white;text-align:center;border-radius:80px;padding:21px 8px;font-size:clamp(23px,6vw,37px);font-weight:900;letter-spacing:2px;margin:12px 0 32px}.panel{background:white;border:4px solid #f6cf65;border-radius:34px;padding:24px 18px}label{display:block;font-size:21px;font-weight:800;margin:0 0 12px}input[type=date]{width:100%;font-size:23px;padding:13px;border:2px solid #d4c9aa;border-radius:12px;background:#fff;color:#15243a;margin-bottom:24px}.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.nums input{width:100%;min-width:0;text-align:center;font-size:clamp(19px,5vw,29px);font-weight:800;padding:13px 0;border:2px solid #dec98c;border-radius:13px;color:#142744;background:#fff}.actions{display:flex;gap:12px;margin-top:25px}.actions button{flex:1;background:#087e6b;color:white;border:0;border-radius:13px;padding:15px 7px;font-size:19px;font-weight:800;cursor:pointer}.actions button.secondary{background:#e7eadf;color:#164b40}.notice{min-height:24px;margin:12px 0 0;text-align:center;font-size:15px;color:#9a4a13}.nums input:focus,input[type=date]:focus{outline:3px solid #f5bd00;outline-offset:1px}@media(max-width:360px){main{padding:10px;border-width:8px}.panel{padding:18px 10px}.heading{letter-spacing:0}.nums{gap:5px}}
</style>
</head>
<body><main>
<header class="heading">539AI預測</header>
<section class="panel">
<label for="date">開獎日期</label>
<input id="date" type="date">
<label>預測號碼（01～39）</label>
<div class="nums" id="nums"></div>
<div class="actions"><button id="save" type="button">儲存預測</button><button class="secondary" id="clear" type="button">清除號碼</button></div>
<p class="notice" id="notice" role="status"></p>
</section>
</main>
<script>
'use strict';
const KEY='539-manual-prediction-v1';
const date=document.getElementById('date');
const nums=document.getElementById('nums');
const notice=document.getElementById('notice');
const fields=Array.from({length:5},(_,i)=>{const el=document.createElement('input');el.type='text';el.inputMode='numeric';el.maxLength=2;el.placeholder='?';el.setAttribute('aria-label','預測號碼 '+(i+1));nums.appendChild(el);return el;});
function message(s){notice.textContent=s;}
function load(){try{const data=JSON.parse(localStorage.getItem(KEY)||'null');if(data&&typeof data.date==='string'&&Array.isArray(data.numbers)){date.value=data.date;fields.forEach((f,i)=>f.value=data.numbers[i]||'');return;}}catch(e){}const d=new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');date.value=`${y}-${m}-${day}`;}
document.getElementById('save').onclick=()=>{const values=fields.map(f=>f.value.trim());const numbers=values.map(v=>Number(v));if(!date.value){message('請選擇預測開獎日期');return;}if(values.some(v=>!/^\d{1,2}$/.test(v))||numbers.some(n=>n<1||n>39)||new Set(numbers).size!==5){message('請輸入五個不同的 01～39 號碼');return;}numbers.sort((a,b)=>a-b);const formatted=numbers.map(n=>String(n).padStart(2,'0'));fields.forEach((f,i)=>f.value=formatted[i]);try{localStorage.setItem(KEY,JSON.stringify({date:date.value,numbers:formatted}));message('預測資料已儲存在此手機瀏覽器');}catch(e){message('已顯示預測號碼，但瀏覽器未能儲存資料');}};
document.getElementById('clear').onclick=()=>{fields.forEach(f=>f.value='');message('號碼已清除，按儲存預測可保存新號碼');};
load();
</script></body></html>
