
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4bd00">
<title>539AI預測統計</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4bd00;font-family:system-ui,"Noto Sans TC",sans-serif;color:#123b33}
main{width:min(100%,650px);min-height:100dvh;margin:auto;padding:22px 16px 36px;background:#fffbea;border:12px solid #f4bd00}
h1{margin:8px 0 30px;padding:22px 8px;border-radius:70px;background:#087b69;color:white;text-align:center;font-size:clamp(25px,7vw,39px);letter-spacing:1px}
.panel{background:white;border:6px solid #ffcc48;border-radius:48px;text-align:center;padding:25px 14px;margin:0 0 25px}
h2{font-size:clamp(23px,6vw,31px);margin:0 0 14px;color:#a9410d}
.date{font-weight:850;font-size:clamp(29px,8vw,48px);color:#101b39}
.balls{display:flex;justify-content:center;gap:clamp(3px,1.2vw,12px);margin-top:20px}
.ball{width:18%;aspect-ratio:1;border:3px solid #d71920;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#fff7c7,#ffe700 60%,#f7ae00);font-size:clamp(20px,6vw,40px);font-weight:900;color:#091b52;box-shadow:inset 0 0 0 2px #fff7c4}
.controls{margin-top:30px;text-align:center}
button{background:#087b69;color:white;border:0;border-radius:12px;padding:13px 22px;font-size:17px;font-weight:750;cursor:pointer}
form{display:none;background:#fff;border:3px solid #ffcc48;border-radius:25px;padding:20px;margin-top:22px}
form.visible{display:block}
label{display:block;font-weight:700;margin:12px 0 8px}
input[type=date]{font:inherit;padding:10px;border:1px solid #b9b9b9;border-radius:9px;width:100%;max-width:260px}
.inputs{display:flex;gap:7px;justify-content:space-between}
.inputs input{width:19%;min-width:0;padding:12px 2px;text-align:center;font-size:21px;border:2px solid #e3c779;border-radius:12px}
.actions{display:flex;gap:10px;justify-content:center;margin-top:20px}
.secondary{background:#68757a}
#error{color:#b71c1c;min-height:1.5em;font-weight:650}
@media(max-width:380px){main{border-width:7px;padding:14px 9px}.panel{border-width:4px;border-radius:32px;padding:20px 8px}.ball{border-width:2px}}
</style>
</head>
<body>
<main>
<h1>539AI預測統計</h1>
<section class="panel"><h2>預測開獎日期</h2><div class="date" id="showDate">尚未設定</div></section>
<section class="panel"><h2>預測開獎號碼</h2><div class="balls" id="balls"></div></section>
<div class="controls"><button id="editButton" type="button">填寫／修改預測</button></div>
<form id="editor">
<label for="dateInput">預測開獎日期</label><input id="dateInput" type="date" required>
<label>輸入五個預測號碼（01～39）</label>
<div class="inputs" id="numberInputs"></div>
<p id="error" role="alert"></p>
<div class="actions"><button type="submit">確認預測</button><button type="button" class="secondary" id="cancelButton">取消</button></div>
</form>
</main>
<script>
(()=>{
'use strict';
const KEY='539-manual-prediction-v1';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const inputBox=$('numberInputs');
for(let i=0;i<5;i++){
 const input=document.createElement('input');
 input.type='number';input.min='1';input.max='39';input.step='1';input.inputMode='numeric';input.required=true;input.placeholder='?';input.setAttribute('aria-label',`第${i+1}個號碼`);
 inputBox.appendChild(input);
}
const inputs=[...inputBox.querySelectorAll('input')];
let saved=null;
try{const value=JSON.parse(localStorage.getItem(KEY));if(value&&/^\d{4}-\d{2}-\d{2}$/.test(value.date)&&Array.isArray(value.numbers)&&value.numbers.length===5&&value.numbers.every(n=>Number.isInteger(n)&&n>=1&&n<=39)&&new Set(value.numbers).size===5)saved=value;}catch(e){}
function display(){
 $('showDate').textContent=saved?saved.date.replaceAll('-','/'):'尚未設定';
 $('balls').replaceChildren();
 for(const number of (saved?saved.numbers:[null,null,null,null,null])){
  const ball=document.createElement('div');ball.className='ball';ball.textContent=number===null?'?':pad(number);$('balls').appendChild(ball);
 }
}
function openEditor(){
 $('dateInput').value=saved?saved.date:new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
 inputs.forEach((el,i)=>el.value=saved?saved.numbers[i]:'');
 $('error').textContent='';$('editor').classList.add('visible');$('editButton').hidden=true;
}
function closeEditor(){$('editor').classList.remove('visible');$('editButton').hidden=false;}
$('editButton').addEventListener('click',openEditor);
$('cancelButton').addEventListener('click',closeEditor);
$('editor').addEventListener('submit',event=>{
 event.preventDefault();
 const date=$('dateInput').value;
 const numbers=inputs.map(el=>Number(el.value));
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||inputs.some(el=>el.value.trim()==='')||numbers.some(n=>!Number.isInteger(n)||n<1||n>39)||new Set(numbers).size!==5){
  $('error').textContent='請填寫有效日期及五個不同的 01～39 號碼。';return;
 }
 numbers.sort((a,b)=>a-b);
 const next={date,numbers};
 try{localStorage.setItem(KEY,JSON.stringify(next));}catch(e){$('error').textContent='無法儲存到瀏覽器，請確認未使用無痕模式或儲存空間限制。';return;}
 saved=next;display();closeEditor();
});
display();
if(!saved)openEditor();
})();
</script>
</body>
</html>
